<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="A high-performance Reddit scroller with grid browse and infinite reel." />
    <meta name="theme-color" content="#000000" />
    <title>RedditScroller – Premium Reddit Feed</title>
    
    <!-- Font Preloading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&family=Geist+Mono:wght@400;600&display=swap" rel="preload" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  </head>
  <body>
    <!-- ── Background Glows ────────────────────────────────────── -->
    <div class="bg-glows" aria-hidden="true">
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>
    </div>

    <!-- ── Top Navigation Bar ───────────────────────────────────── -->
    <nav class="top-bar" id="topBar">
      <div class="top-bar-inner">
        <div class="app-brand">Reddit<span>Scroller</span></div>
        <div class="search-wrap">
          <div class="search-container">
            <i class="bi bi-search search-icon"></i>
            <input type="text" class="search-input" placeholder="Search subreddits (comma or + separated)..." id="subredditSearch" autocomplete="off">
            <div id="suggestions" class="suggestions-container"></div>
          </div>
        </div>
        <button class="icon-btn" id="blacklistBtn" title="Filter"><i class="bi bi-slash-circle"></i></button>
      </div>
      <div class="filter-row">
        <div class="sort-pills" id="sortPills">
          <button class="sort-pill active" data-sort="hot"><i class="bi bi-fire"></i> Hot</button>
          <button class="sort-pill" data-sort="new"><i class="bi bi-stars"></i> New</button>
          <button class="sort-pill" data-sort="top"><i class="bi bi-bar-chart-fill"></i> Top</button>
          <button class="sort-pill" data-sort="rising"><i class="bi bi-graph-up-arrow"></i> Rising</button>
          <button class="sort-pill" data-sort="controversial"><i class="bi bi-lightning-charge-fill"></i> Controversial</button>
        </div>
        <div class="time-pills" id="timePills" style="display:none;">
          <span class="time-label">Time:</span>
          <button class="sort-pill" data-time="hour">Hour</button>
          <button class="sort-pill active" data-time="day">Day</button>
          <button class="sort-pill" data-time="week">Week</button>
          <button class="sort-pill" data-time="month">Month</button>
          <button class="sort-pill" data-time="year">Year</button>
          <button class="sort-pill" data-time="all">All</button>
        </div>
      </div>
    </nav>

    <!-- ── Home Flex Grid ───────────────────────────────────────── -->
    <div id="home" class="home-flex">
      <div id="homeGrid" class="home-grid">
        <!-- Grid items will be injected here -->
      </div>
      <div id="gridLoader" class="grid-loader"><div class="spinner"></div></div>
    </div>

    <!-- ── Reel View Overlay ─────────────────────────────────────── -->
    <div id="reelView" class="reel-view">
      <button class="reel-close" id="closeReel"><i class="bi bi-arrow-left"></i></button>
      <div id="app" class="reel-feed">
        <div id="loader" class="loader"><div class="spinner"></div></div>
      </div>

      <!-- ── Comment Sheet ──────────────────────────────────────── -->
      <div id="commentSheet" class="comment-sheet">
        <div class="comment-header">
          <div class="comment-title">
            <div class="comment-post-title" id="commentPostTitle">Comments</div>
            <div style="display:flex;gap:0.5rem;align-items:center;">
              <span class="comment-subreddit" id="commentSubreddit"></span>
              <span class="comment-count" id="commentCount">0 comments</span>
            </div>
          </div>
          <button class="comment-close" id="closeComments" title="Close"><i class="bi bi-x-lg"></i></button>
        </div>
        <div id="commentList" class="comment-list">
          <!-- Comments will be injected here -->
        </div>
        <div id="commentLoader" class="comment-loader">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- ── Blacklist Modal ────────────────────────────────────────── -->
    <div id="blacklistModal" class="modal-overlay" style="display:none;">
      <div class="modal-box">
        <h3><i class="bi bi-slash-circle"></i> Blacklist</h3>
        <p class="modal-hint">Posts containing these words in the title or subreddit will be hidden.</p>
        <div class="blacklist-tags" id="blacklistTags"></div>
        <div class="blacklist-input-row">
          <input type="text" id="blacklistInput" placeholder="Add keyword..." class="search-input">
          <button id="addBlacklist" class="pill-btn"><i class="bi bi-plus-lg"></i></button>
        </div>
        <button id="closeModal" class="pill-btn close-btn">Done</button>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
