<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ANIVERSE — Anime Streaming Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#050507; --surface:#101014; --card:#16161d; --border:rgba(255,255,255,0.09);
    --accent:#00e5ff; --accent2:#ff3b6b; --text:#f4f5f7; --muted:#8a8f98; --star:#ffb43b;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:'Oswald','Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); letter-spacing:.2px; min-height:100vh; }
  img { display:block; }
  .mono { font-family:'Space Mono',monospace; }
  /* ===== navbar ===== */
  header { position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:center; gap:22px; padding:16px 40px; transition:background .3s, border-color .3s; border-bottom:1px solid transparent; }
  header.solid { background:rgba(5,5,7,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
  .brand { font-family:'Anton',sans-serif; font-size:23px; letter-spacing:1px; display:flex; align-items:center; gap:10px; cursor:pointer; text-transform:uppercase; }
  .brand .pi { width:27px; height:27px; border-radius:7px; background:var(--accent2); display:grid; place-items:center; color:#fff; font-size:12px; box-shadow:0 4px 14px rgba(255,59,107,.5); }
  nav { display:flex; gap:4px; }
  nav button { background:none; border:none; color:#cfd2d7; font-family:'Oswald'; font-size:14px; font-weight:500; letter-spacing:.4px; padding:8px 13px; cursor:pointer; border-radius:7px; transition:.2s; }
  nav button:hover { color:#fff; background:rgba(255,255,255,.08); }
  nav button.on { color:#fff; }
  .tools { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .search { position:relative; display:flex; align-items:center; }
  .search input { width:210px; background:rgba(255,255,255,.07); border:1px solid var(--border); color:#fff; font-family:'Oswald'; font-size:13px; padding:9px 12px 9px 34px; border-radius:9px; outline:none; transition:.25s; }
  .search input:focus { border-color:var(--accent2); width:250px; }
  .search svg { position:absolute; left:11px; width:15px; height:15px; fill:var(--muted); pointer-events:none; }
  .navbtn { background:rgba(255,255,255,.07); border:1px solid var(--border); color:#fff; font-family:'Oswald'; font-size:13px; font-weight:600; padding:8px 13px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:.2s; }
  .navbtn:hover { border-color:var(--accent2); color:#fff; }
  .navbtn .ct { background:var(--accent2); color:#fff; border-radius:9px; font-size:11px; font-weight:700; padding:1px 7px; }
  /* ===== hero ===== */
  #hero { position:relative; height:80vh; min-height:540px; width:100%; }
  #heroBg { position:absolute; inset:0; background-size:cover; background-position:center 16%; transition:background-image .6s ease; }
  #hero .fade { position:absolute; inset:0; background:linear-gradient(90deg, rgba(5,5,7,.94) 0%, rgba(5,5,7,.6) 32%, transparent 68%), linear-gradient(0deg, var(--bg) 1%, transparent 46%); }
  #heroContent { position:absolute; left:40px; bottom:11%; max-width:640px; z-index:3; }
  #heroContent h1 { font-family:'Anton',sans-serif; font-size:clamp(40px,6.2vw,80px); line-height:.92; text-transform:uppercase; letter-spacing:-.5px; }
  .hmeta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:15px; font-size:15px; color:#dcdfe4; }
  .hmeta .star { color:var(--star); font-weight:600; }
  .hmeta .dot, .rm .dot { width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,.45); display:inline-block; }
  .hsyn { margin-top:15px; color:#c2c7cd; font-weight:300; font-size:15.5px; line-height:1.5; max-width:540px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .hbtns { display:flex; gap:12px; margin-top:24px; flex-wrap:wrap; }
  #heroDots { position:absolute; right:40px; bottom:11%; display:flex; gap:8px; z-index:3; }
  #heroDots span { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.3); cursor:pointer; transition:.25s; }
  #heroDots span.on { background:var(--accent2); width:24px; border-radius:5px; }
  /* shared pill buttons */
  .pbtn { display:inline-flex; align-items:center; gap:8px; cursor:pointer; border:none; border-radius:32px; padding:12px 28px; font-family:'Oswald'; font-size:15px; font-weight:600; letter-spacing:.5px; background:#fff; color:#0a0a0c; transition:.2s; text-decoration:none; }
  .pbtn:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(255,255,255,.18); }
  .obtn { display:inline-flex; align-items:center; gap:8px; cursor:pointer; border:1px solid rgba(255,255,255,.28); border-radius:32px; padding:11px 22px; font-family:'Oswald'; font-size:14px; font-weight:500; letter-spacing:.5px; background:rgba(255,255,255,.08); color:#fff; transition:.2s; text-decoration:none; }
  .obtn:hover { background:rgba(255,255,255,.18); border-color:#fff; }
  .obtn.icon { width:46px; height:46px; padding:0; justify-content:center; border-radius:50%; font-size:22px; }
  .obtn.on { background:var(--accent2); border-color:var(--accent2); color:#fff; }
  /* ===== rows ===== */
  #home { position:relative; z-index:2; margin-top:-66px; padding-bottom:30px; }
  .row { margin:34px 0; }
  .rowhead { display:flex; align-items:center; justify-content:space-between; padding:0 40px; margin-bottom:14px; }
  .rowhead h2 { font-family:'Oswald'; font-weight:600; font-size:21px; color:#fff; display:flex; align-items:center; gap:11px; }
  .rowhead h2 i { width:4px; height:21px; border-radius:2px; background:var(--accent2); display:inline-block; }
  .track-wrap { position:relative; }
  .track { display:flex; gap:14px; overflow-x:auto; scroll-behavior:smooth; padding:6px 40px 12px; scrollbar-width:none; }
  .track::-webkit-scrollbar { display:none; }
  .rnav { position:absolute; top:0; bottom:12px; width:58px; border:none; color:#fff; font-size:30px; cursor:pointer; z-index:5; opacity:0; transition:opacity .2s; display:flex; align-items:center; justify-content:center; }
  .rnav.l { left:0; background:linear-gradient(90deg, rgba(5,5,7,.92), transparent); }
  .rnav.r { right:0; background:linear-gradient(270deg, rgba(5,5,7,.92), transparent); }
  .track-wrap:hover .rnav { opacity:1; }
  .rnav:hover { color:var(--accent2); }
  .rempty { padding:28px 4px; color:var(--muted); font-size:14px; font-family:'Space Mono',monospace; }
  /* landscape card */
  .rcard { flex:none; width:264px; cursor:pointer; transition:transform .2s; }
  .rcard .thumb { position:relative; width:100%; aspect-ratio:16/10; border-radius:10px; overflow:hidden; background:var(--card); border:1px solid var(--border); }
  .rcard .thumb img { width:100%; height:100%; object-fit:cover; transition:.3s; }
  .rcard:hover { transform:translateY(-4px); }
  .rcard:hover .thumb { border-color:var(--accent2); box-shadow:0 12px 30px rgba(0,0,0,.55); }
  .rcard .wl { position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,.6); display:none; place-items:center; color:var(--accent2); font-size:13px; }
  .rcard.inwl .wl { display:grid; }
  .rcard .rt { font-family:'Oswald'; font-size:15px; color:#fff; margin-top:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rcard .rm { font-size:12.5px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:7px; }
  .rcard .rm .star { color:var(--star); }
  /* rank card */
  .rcard.rank { width:172px; }
  .rcard.rank .poster { position:relative; width:100%; aspect-ratio:2/3; border-radius:10px; overflow:hidden; background:var(--card); border:1px solid var(--border); }
  .rcard.rank .poster img { width:100%; height:100%; object-fit:cover; }
  .rcard.rank:hover .poster { border-color:var(--accent2); box-shadow:0 12px 30px rgba(0,0,0,.55); }
  .rib { position:absolute; top:0; left:11px; z-index:2; background:var(--accent2); color:#fff; font-family:'Oswald'; font-weight:700; font-size:11px; letter-spacing:1px; padding:5px 8px 9px; clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%); box-shadow:0 4px 10px rgba(0,0,0,.45); }
  /* ===== grid view (search / list) ===== */
  #gridView { display:none; padding:104px 40px 60px; min-height:100vh; }
  #gridView.show { display:block; }
  .gvhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; gap:16px; }
  .gvhead h2 { font-family:'Anton',sans-serif; font-size:clamp(26px,4vw,38px); text-transform:uppercase; letter-spacing:1px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:24px 18px; }
  .grid-tools { margin:-8px 0 18px; }
  .api-notice { padding:12px 14px; border:1px solid var(--border); border-left:3px solid var(--accent2); border-radius:8px; color:#d6d9de; background:rgba(255,255,255,.04); font-size:13px; line-height:1.5; }
  .api-notice code { font-family:'Space Mono',monospace; color:#fff; }
  .grid .rcard { width:auto; }
  .grid .rempty { grid-column:1/-1; }
  /* ===== footer ===== */
  footer { padding:46px 40px 60px; border-top:1px solid var(--border); color:var(--muted); font-size:13px; line-height:1.7; }
  footer .fb { font-family:'Anton',sans-serif; font-size:22px; color:#fff; letter-spacing:1px; margin-bottom:12px; display:flex; align-items:center; gap:9px; }
  footer a { color:var(--accent); text-decoration:none; }
  /* ===== deep dive ===== */
  #deep { position:fixed; inset:0; z-index:58; background:var(--bg); overflow-y:auto; display:none; }
  #deep.show { display:block; }
  #deepBanner { position:relative; height:64vh; min-height:420px; background-size:cover; background-position:center 20%; }
  #deepBanner::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(5,5,5,.12) 0%, rgba(5,5,5,.04) 42%, var(--bg) 99%), linear-gradient(90deg, rgba(5,5,5,.85), rgba(5,5,5,.2) 55%, transparent 78%); }
  .dtopbtn { position:absolute; top:24px; z-index:5; width:42px; height:42px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.16); color:#fff; cursor:pointer; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:20px; line-height:1; backdrop-filter:blur(8px); transition:.2s; }
  .dtopbtn:hover { background:rgba(0,0,0,.75); border-color:#fff; }
  #deepBackBtn { left:26px; }
  #deepClose { right:26px; }
  #deepHero { position:absolute; left:54px; right:54px; bottom:54px; z-index:3; max-width:760px; }
  #deepHero h1 { font-family:'Anton',sans-serif; font-size:clamp(42px,7vw,92px); line-height:.9; text-transform:uppercase; letter-spacing:-.5px; }
  #deepHero .jp { font-family:'Space Mono',monospace; color:var(--muted); font-size:13px; margin-top:10px; letter-spacing:1px; }
  .metaline { display:flex; align-items:center; gap:11px; flex-wrap:wrap; margin-top:16px; font-family:'Oswald'; font-size:15px; color:#d6d9de; }
  .metaline .star { color:var(--star); font-weight:600; }
  .metaline .gtag { color:#aeb3ba; }
  .metaline .dot, .pcard .dot { width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,.4); display:inline-block; }
  #deepHero .syn { color:#c2c7cd; font-weight:300; font-size:15.5px; line-height:1.55; margin-top:18px; max-width:640px; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .deepactions { display:flex; align-items:center; gap:12px; margin-top:24px; flex-wrap:wrap; }
  #deepBody { padding:42px 54px 90px; position:relative; z-index:2; max-width:1180px; }
  .dsec { margin-top:48px; }
  .dsec:first-child { margin-top:6px; }
  .dsec h2 { font-family:'Oswald'; font-size:21px; font-weight:600; letter-spacing:.3px; color:#fff; margin-bottom:22px; display:flex; align-items:center; gap:12px; }
  .dsec h2::before { content:''; width:4px; height:22px; border-radius:2px; background:var(--accent2); }
  .actorgrid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px 38px; }
  .actor { display:flex; align-items:center; gap:14px; min-width:0; }
  .actor .av { width:46px; height:46px; border-radius:50%; flex:none; object-fit:cover; background:var(--card); border:1px solid var(--border); }
  .actor .ph { width:46px; height:46px; border-radius:50%; flex:none; display:grid; place-items:center; font-family:'Oswald'; font-weight:600; font-size:16px; color:#fff; background:linear-gradient(135deg,#2a2a34,#15151b); border:1px solid var(--border); }
  .actor .nm { font-family:'Oswald'; font-size:15px; color:#fff; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .actor .role { font-family:'Oswald'; font-size:13px; color:var(--muted); margin-top:2px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pgrid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px 22px; }
  .pcard { cursor:pointer; transition:transform .2s; min-width:0; }
  .pcard .pimg { width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:10px; background:var(--card); border:1px solid var(--border); transition:.2s; display:block; }
  .pcard:hover { transform:translateY(-4px); }
  .pcard:hover .pimg { border-color:var(--accent2); box-shadow:0 12px 30px rgba(0,0,0,.55); }
  .pcard .pt { font-family:'Oswald'; font-size:15px; color:#fff; margin-top:11px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pcard .pm { font-family:'Oswald'; font-size:12.5px; color:var(--muted); margin-top:4px; display:flex; align-items:center; gap:8px; }
  .pcard .pm .star { color:var(--star); }
  /* ===== modal ===== */
  #modal { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; }
  #modal.show { display:flex; }
  #modal .wrap { width:min(960px,92vw); aspect-ratio:16/9; position:relative; }
  #modal iframe { width:100%; height:100%; border:0; border-radius:10px; }
  #modal .close { position:absolute; top:-44px; right:0; background:none; border:none; color:#fff; font-size:30px; cursor:pointer; }
  #modalWatch { position:absolute; top:-46px; left:0; }
  #modal .noembed { display:flex; align-items:center; justify-content:center; text-align:center; height:100%; padding:24px; color:var(--muted); font-family:'Space Mono',monospace; font-size:13px; line-height:1.6; border:1px solid var(--border); border-radius:10px; }
  /* ===== loader + toast ===== */
  #loader { position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:var(--bg); transition:opacity .5s; }
  #loader.hide { opacity:0; pointer-events:none; }
  #loader .lg { font-family:'Anton',sans-serif; font-size:30px; letter-spacing:6px; text-transform:uppercase; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .spin { width:42px; height:42px; border:3px solid rgba(255,255,255,.14); border-top-color:var(--accent2); border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #loader p { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--muted); }
  #toast { position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-12px); z-index:80; background:rgba(16,16,20,.97); border:1px solid var(--border); border-left:3px solid var(--accent2); color:#fff; padding:10px 18px; font-family:'Space Mono',monospace; font-size:12px; opacity:0; transition:.35s; pointer-events:none; border-radius:6px; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @media (max-width:820px) {
    header { padding:12px 18px; gap:12px; }
    nav { display:none; }
    .search input { width:150px; } .search input:focus { width:180px; }
    #hero { height:66vh; min-height:430px; }
    #heroContent { left:18px; right:18px; bottom:9%; } #heroDots { right:18px; bottom:9%; }
    #home { margin-top:-46px; }
    .rowhead { padding:0 18px; } .track { padding:6px 18px 12px; }
    .rcard { width:210px; } .rcard.rank { width:140px; }
    .rnav { display:none; }
    #gridView { padding:90px 18px 50px; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:18px 12px; }
    footer { padding:36px 18px 50px; }
    #deepHero { left:20px; right:20px; bottom:34px; max-width:none; }
    #deepHero h1 { font-size:44px; }
    #deepBody { padding:30px 20px 80px; }
    .dtopbtn { top:16px; } #deepBackBtn { left:16px; } #deepClose { right:16px; }
    .actorgrid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 18px; }
    .pgrid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 14px; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand" id="brand"><span class="pi">▶</span>ANI<span style="color:var(--accent2)">VERSE</span></div>
    <nav>
      <button id="navHome" class="on">Home</button>
      <button id="navBrowse">Browse</button>
      <button id="navListTop">My List</button>
    </nav>
    <div class="tools">
      <form class="search" id="searchForm">
        <svg viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16z" fill="none" stroke="#8a8f98" stroke-width="2"/></svg>
        <input id="searchInput" type="text" placeholder="Search anime…" autocomplete="off" />
      </form>
      <button class="navbtn" id="navList">♥ List <span class="ct" id="wlCount">0</span></button>
    </div>
  </header>

  <div id="landing">
    <section id="hero">
      <div id="heroBg"></div>
      <div class="fade"></div>
      <div id="heroContent"></div>
      <div id="heroDots"></div>
    </section>
    <div id="home"></div>
    <footer>
      <div class="fb"><span class="pi" style="width:24px;height:24px;border-radius:6px;background:var(--accent2);display:grid;place-items:center;font-size:11px">▶</span> ANIVERSE</div>
      <div>A cinematic anime discovery hub powered by TMDB. This demo does not host any media — trailers link to YouTube and details link to TMDB.</div>
      <div style="margin-top:8px">Built for anime fans · Data &amp; images courtesy of <a href="https://www.themoviedb.org" target="_blank" rel="noopener">The Movie Database</a>.</div>
    </footer>
  </div>

  <div id="gridView">
    <div class="gvhead"><h2 id="gvTitle">Results</h2><button class="obtn" id="gvClose">← Back home</button></div>
    <div class="grid-tools">
      <div id="apiNotice" class="api-notice" hidden></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="deep">
    <div id="deepBanner">
      <button class="dtopbtn" id="deepBackBtn">‹</button>
      <button class="dtopbtn" id="deepClose">×</button>
      <div id="deepHero"></div>
    </div>
    <div id="deepBody"></div>
  </div>

  <div id="modal"><div class="wrap"><a id="modalWatch" class="obtn" target="_blank" rel="noopener">Watch on YouTube ↗</a><button class="close" id="modalClose">×</button><div id="modalBody"></div></div></div>
  <div id="toast"></div>
  <div id="loader"><div class="lg">ANIVERSE</div><div class="spin"></div><p>LOADING THE ANIME UNIVERSE…</p></div>

<script>
const TMDB='https://api.themoviedb.org/3';
const IMG='https://image.tmdb.org/t/p/';
const APPEND='videos,credits,recommendations,similar,external_ids,watch/providers,aggregate_credits';
const PARAMS=new URLSearchParams(window.location.search);
const KEY=(PARAMS.get('tmdbKey')||localStorage.getItem('aniverse_tmdb_key')||'').trim();
if(KEY) localStorage.setItem('aniverse_tmdb_key',KEY);
let WL=JSON.parse(localStorage.getItem('aniverse_tmdb_wl')||'[]');
let GENRE_MAP={};
let deepStack=[], currentDeep=null;
let heroItems=[], heroIdx=0, heroTimer=null;
let searchTimer=null;
const $=id=>document.getElementById(id);
const header=document.querySelector('header');
const TODAY=new Date().toISOString().slice(0,10);

function esc(s){ return (s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function showLoader(on){ $('loader').classList.toggle('hide',!on); }
function hasKey(){ return !!KEY; }
function tmdbURL(path,query=''){ return TMDB+path+'?api_key='+encodeURIComponent(KEY)+(query?'&'+query:''); }
function imgURL(size,path){ return path ? IMG+size+path : ''; }
function fallbackSVG(label,kind){
  const bg=kind==='poster' ? '16161d' : '101014';
  return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><rect width="100%" height="100%" fill="#'+bg+'"/><text x="50%" y="50%" fill="#8a8f98" font-family="Arial,sans-serif" font-size="34" text-anchor="middle">'+esc(label||'ANIVERSE')+'</text></svg>');
}
function titleImage(a,kind){
  const preferred=kind==='poster' ? a.poster : a.backdrop;
  const alternate=kind==='poster' ? a.backdrop : a.poster;
  return preferred || alternate || fallbackSVG(a.title,kind);
}
function showApiNotice(){
  const el=$('apiNotice');
  if(!el) return;
  if(hasKey()){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML='TMDB key missing. Open this file with <code>?tmdbKey=YOUR_KEY</code> once, or set <code>localStorage.aniverse_tmdb_key</code> in DevTools.';
}

async function fetchJSON(url,tries=4){
  for(let i=0;i<tries;i++){
    try{ const r=await fetch(url); if(r.status===429){ await new Promise(s=>setTimeout(s,1200)); continue; } if(!r.ok) throw new Error(r.status); return await r.json(); }
    catch(e){ if(i===tries-1) throw e; await new Promise(s=>setTimeout(s,600)); }
  }
}
function gnames(ids){ return (ids||[]).map(id=>({ mal_id:id, name:GENRE_MAP[id]||'' })).filter(x=>x.name); }

function adapt(tv){
  if(!tv) return null;
  const pp=tv.poster_path||tv.backdrop_path;
  const yr=(tv.first_air_date||'').slice(0,4);
  const gids=tv.genre_ids||(tv.genres? tv.genres.map(g=>g.id):[]);
  return {
    id:tv.id, mal_id:tv.id,
    title:tv.name||tv.original_name||'Untitled',
    title_english:tv.name||'',
    title_japanese:tv.original_name||'',
    synopsis:tv.overview||'',
    score:(tv.vote_average!=null && tv.vote_count>0)? tv.vote_average : null,
    members:tv.vote_count||0,
    popularity:tv.popularity||0,
    year:yr? parseInt(yr):'',
    type:'TV',
    poster:imgURL('w500', pp),
    backdrop:tv.backdrop_path? imgURL('w780', tv.backdrop_path) : imgURL('w780', pp),
    genres:gnames(gids), genre_ids:gids,
    orig_lang:tv.original_language,
    url:'https://www.themoviedb.org/tv/'+tv.id,
    _full:false
  };
}
function isAnime(a){ return a && (a.genre_ids||[]).indexOf(16)>=0 && a.orig_lang==='ja'; }

function pickVideo(list){
  const yt=(list||[]).filter(v=>v.site==='YouTube');
  return yt.find(v=>v.type==='Trailer')||yt.find(v=>v.type==='Teaser')||yt.find(v=>v.type==='Clip')||yt.find(v=>v.type==='Opening Credits')||yt[0]||null;
}
function adaptDetail(d){
  const base=adapt(d);
  if(d.backdrop_path) base.backdrop=imgURL('original', d.backdrop_path);
  base.episodes=d.number_of_episodes; base.seasons=d.number_of_seasons; base.status=d.status; base.runtime=(d.episode_run_time&&d.episode_run_time[0])||null;
  base.first_air=d.first_air_date; base.last_air=d.last_air_date; base.in_production=d.in_production;
  base.origin=(d.origin_country||[]).join(', '); base.studios=d.production_companies||[]; base.networks=d.networks||[];
  const tr=pickVideo((d.videos&&d.videos.results)||[]);
  if(tr) base.trailer={ youtube_id:tr.key };
  let cast=(d.credits&&d.credits.cast)||[];
  if((!cast||!cast.length)&&d.aggregate_credits) cast=(d.aggregate_credits.cast||[]).map(c=>({ name:c.name, profile_path:c.profile_path, character:(c.roles&&c.roles[0]&&c.roles[0].character)||'' }));
  base.credits=cast;
  base.recs=(d.recommendations&&d.recommendations.results)||[];
  base.similar=(d.similar&&d.similar.results)||[];
  base._full=true;
  return base;
}
function detailUrl(id){ return tmdbURL('/tv/'+id,'append_to_response='+encodeURIComponent(APPEND)); }
function discQS(extra){ return 'with_original_language=ja&include_adult=false&'+extra; }

async function ensureTrailer(a){
  if(a.trailer&&a.trailer.youtube_id) return a.trailer;
  const langs=['','&language=ja','&language=en-US'];
  for(let i=0;i<langs.length;i++){
    try{ const v=await fetchJSON(tmdbURL('/tv/'+a.mal_id+'/videos', langs[i].replace(/^&/,'')),2); const tr=pickVideo((v&&v.results)||[]); if(tr){ a.trailer={ youtube_id:tr.key }; return a.trailer; } }catch(e){}
  }
  return null;
}
async function playTrailer(a){
  if(!a) return;
  toast('Loading trailer…');
  const t=await ensureTrailer(a);
  const yt=t&&t.youtube_id?t.youtube_id:null;
  $('modalWatch').href = yt ? 'https://www.youtube.com/watch?v='+yt : 'https://www.youtube.com/results?search_query='+encodeURIComponent((a.title||'')+' anime trailer');
  if(yt){ $('modalBody').innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+yt+'?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>'; }
  else { $('modalBody').innerHTML='<div class="noembed">No embeddable trailer was found for this title.<br>Use “Watch on YouTube” above to open it directly.</div>'; }
  $('modal').classList.add('show');
}
function closeModal(){ $('modal').classList.remove('show'); $('modalBody').innerHTML=''; }

/* ===== watchlist ===== */
function inWL(a){ return a&&WL.some(x=>x.id===a.id||x.mal_id===a.mal_id); }
function saveWL(){ localStorage.setItem('aniverse_tmdb_wl',JSON.stringify(WL)); $('wlCount').textContent=WL.length; }
function toggleWLObj(a){
  if(!a) return;
  if(inWL(a)) WL=WL.filter(x=>x.id!==a.id && x.mal_id!==a.mal_id);
  else WL.push({ id:a.id, mal_id:a.mal_id, title:a.title, poster:a.poster, backdrop:a.backdrop, score:a.score, year:a.year, type:a.type||'TV', genres:a.genres, genre_ids:a.genre_ids, orig_lang:a.orig_lang, synopsis:a.synopsis, url:a.url });
  saveWL();
  document.querySelectorAll('.rcard[data-id="'+a.id+'"]').forEach(el=>el.classList.toggle('inwl',inWL(a)));
}

/* ===== cards / rows ===== */
function metaHTML(a){ const m=[]; if(a.score) m.push('<span class="star">★ '+(+a.score).toFixed(1)+'</span>'); if(a.year) m.push('<span>'+a.year+'</span>'); m.push('<span>'+(a.type||'TV')+'</span>'); return m.join('<span class="dot"></span>'); }
function cardHTML(a,layout,rank){
  if(layout==='rank'){
    return '<div class="rcard rank'+(inWL(a)?' inwl':'')+'" data-id="'+a.id+'"><div class="poster"><span class="rib">TOP '+(rank<10?'0'+rank:rank)+'</span><span class="wl">♥</span><img src="'+titleImage(a,'poster')+'" loading="lazy" alt="'+esc(a.title)+' poster"></div><div class="rt">'+esc(a.title)+'</div><div class="rm">'+metaHTML(a)+'</div></div>';
  }
  return '<div class="rcard'+(inWL(a)?' inwl':'')+'" data-id="'+a.id+'"><div class="thumb"><span class="wl">♥</span><img src="'+titleImage(a,'backdrop')+'" loading="lazy" alt="'+esc(a.title)+' artwork"></div><div class="rt">'+esc(a.title)+'</div><div class="rm">'+metaHTML(a)+'</div></div>';
}
function wireCards(container){ container.querySelectorAll('.rcard').forEach(el=>el.onclick=()=>openTitle(el.dataset.id)); }

const ROWS=[
  {key:'top10', title:'TOP 10 Today', layout:'rank', limit:10, make:p=>tmdbURL('/trending/tv/week','page='+p)},
  {key:'trend', title:'Trending Now', layout:'land', limit:18, make:p=>tmdbURL('/trending/tv/day','page='+p)},
  {key:'new', title:'New Releases', layout:'land', limit:18, make:p=>tmdbURL('/discover/tv',discQS('with_genres=16&sort_by=first_air_date.desc&vote_count.gte=8&first_air_date.lte='+TODAY)+'&page='+p)},
  {key:'toprated', title:'Top Rated', layout:'land', limit:18, make:p=>tmdbURL('/discover/tv',discQS('with_genres=16&sort_by=vote_average.desc&vote_count.gte=300')+'&page='+p)},
  {key:'action', title:'Action & Adventure', layout:'land', limit:18, make:p=>tmdbURL('/discover/tv',discQS('with_genres=16,10759&sort_by=popularity.desc&vote_count.gte=12')+'&page='+p)},
  {key:'comedy', title:'Comedy', layout:'land', limit:18, make:p=>tmdbURL('/discover/tv',discQS('with_genres=16,35&sort_by=popularity.desc&vote_count.gte=12')+'&page='+p)},
  {key:'fantasy', title:'Sci-Fi & Fantasy', layout:'land', limit:18, make:p=>tmdbURL('/discover/tv',discQS('with_genres=16,10765&sort_by=popularity.desc&vote_count.gte=12')+'&page='+p)},
  {key:'drama', title:'Drama', layout:'land', limit:18, make:p=>tmdbURL('/discover/tv',discQS('with_genres=16,18&sort_by=popularity.desc&vote_count.gte=12')+'&page='+p)}
];

async function loadRow(cfg,track){
  try{
    const [d1,d2]=await Promise.all([ fetchJSON(cfg.make(1)), fetchJSON(cfg.make(2)).catch(()=>({results:[]})) ]);
    let arr=(d1.results||[]).concat(d2.results||[]).map(adapt).filter(Boolean).filter(isAnime).filter(a=>a.backdrop||a.poster);
    const seen=new Set(); arr=arr.filter(a=>{ if(seen.has(a.id)) return false; seen.add(a.id); return true; }).slice(0,cfg.limit||18);
    if(!arr.length){ track.innerHTML='<div class="rempty">Nothing to show here right now.</div>'; return; }
    track.innerHTML=arr.map((a,i)=>cardHTML(a,cfg.layout,i+1)).join('');
    wireCards(track);
  }catch(e){ track.innerHTML='<div class="rempty">Couldn\u2019t load this row.</div>'; }
}
function buildHome(){
  $('home').innerHTML=ROWS.map(c=>'<section class="row"><div class="rowhead"><h2><i></i>'+c.title+'</h2></div><div class="track-wrap"><button class="rnav l" data-k="'+c.key+'" data-d="-1">‹</button><div class="track" id="trk-'+c.key+'"><div class="rempty">Loading…</div></div><button class="rnav r" data-k="'+c.key+'" data-d="1">›</button></div></section>').join('');
  document.querySelectorAll('.rnav').forEach(b=>b.onclick=()=>{ const t=$('trk-'+b.dataset.k); t.scrollBy({ left:(+b.dataset.d)*t.clientWidth*0.85, behavior:'smooth' }); });
  ROWS.forEach(c=>loadRow(c,$('trk-'+c.key)));
}

/* ===== hero ===== */
function renderHero(a){
  if(!a) return;
  $('heroBg').style.backgroundImage='url("'+titleImage(a,'backdrop')+'")';
  const g=(a.genres||[]).slice(0,3).map(x=>x.name).join(', ');
  const meta=[]; if(a.score) meta.push('<span class="star">★ '+(+a.score).toFixed(1)+'</span>'); if(a.year) meta.push('<span>'+a.year+'</span>'); if(g) meta.push('<span>'+esc(g)+'</span>');
  $('heroContent').innerHTML='<h1>'+esc(a.title)+'</h1><div class="hmeta">'+meta.join('<span class="dot"></span>')+'</div><p class="hsyn">'+esc(a.synopsis||'No synopsis available.')+'</p><div class="hbtns"><button class="pbtn" id="heroPlay">▶ Play</button><button class="obtn" id="heroMore">ⓘ See More</button></div>';
  $('heroPlay').onclick=()=>playTrailer(a);
  $('heroMore').onclick=()=>openTitle(a.id);
  $('heroDots').innerHTML=heroItems.map((_,i)=>'<span class="'+(i===heroIdx?'on':'')+'" data-i="'+i+'"></span>').join('');
  $('heroDots').querySelectorAll('span').forEach(s=>s.onclick=()=>{ heroIdx=+s.dataset.i; renderHero(heroItems[heroIdx]); restartHero(); });
}
function restartHero(){ clearInterval(heroTimer); heroTimer=setInterval(()=>{ if(!heroItems.length) return; heroIdx=(heroIdx+1)%heroItems.length; renderHero(heroItems[heroIdx]); }, 8000); }

/* ===== deep dive ===== */
async function openTitle(id){
  if(!id) return; deepStack=[]; showLoader(true);
  try{ const full=adaptDetail(await fetchJSON(detailUrl(id))); renderDeep(full); $('deep').classList.add('show'); $('deep').scrollTop=0; try{ window.history.pushState({deep:1},''); }catch(e){} }
  catch(e){ toast('Could not open this title.'); }
  showLoader(false);
}
async function jumpTo(id){
  if(currentDeep) deepStack.push(currentDeep);
  showLoader(true);
  try{ const full=adaptDetail(await fetchJSON(detailUrl(id))); renderDeep(full); $('deep').scrollTop=0; }
  catch(e){ toast('Could not load that title.'); deepStack.pop(); }
  showLoader(false);
}
function deepBack(){ if(deepStack.length){ renderDeep(deepStack.pop()); $('deep').scrollTop=0; } else closeDeep(); }
function closeDeep(){ $('deep').classList.remove('show'); deepStack=[]; currentDeep=null; }

function renderDeep(a){
  currentDeep=a;
  $('deepBanner').style.backgroundImage='url("'+titleImage(a,'backdrop')+'")';
  const sc=a.score;
  const sub=a.title_japanese&&a.title_japanese!==a.title?a.title_japanese:'';
  const rt=a.runtime?(a.runtime>=60?Math.floor(a.runtime/60)+'h '+(a.runtime%60)+'m':a.runtime+'m'):(a.episodes?a.episodes+' eps':'');
  const gtxt=(a.genres||[]).slice(0,3).map(g=>g.name).join(', ');
  const meta=[];
  if(sc) meta.push('<span class="star">★ '+(+sc).toFixed(1)+'</span>');
  if(a.year) meta.push('<span>'+a.year+'</span>');
  if(rt) meta.push('<span>'+rt+'</span>');
  if(a.status) meta.push('<span>'+a.status+'</span>');
  if(gtxt) meta.push('<span class="gtag">'+esc(gtxt)+'</span>');
  const fav=inWL(a);
  $('deepHero').innerHTML=
    '<h1>'+esc(a.title||'')+'</h1>'+(sub?'<div class="jp">'+esc(sub)+'</div>':'')+
    '<div class="metaline">'+meta.join('<span class="dot"></span>')+'</div>'+
    '<p class="syn">'+esc(a.synopsis||'No synopsis available.')+'</p>'+
    '<div class="deepactions">'+
      '<button class="pbtn" id="deepTrailer">▶ Trailer</button>'+
      '<button class="obtn icon'+(fav?' on':'')+'" id="deepHeart" title="Watchlist">'+(fav?'♥':'+')+'</button>'+
      '<button class="obtn" id="deepSim">✦ Similars</button>'+
      '<a class="obtn" href="'+a.url+'" target="_blank" rel="noopener">TMDB ↗</a>'+
    '</div>';
  const initials=n=>(n||'?').split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
  const cast=(a.credits||[]).filter(c=>c.name).slice(0,12);
  const actorHtml=cast.map(c=>'<div class="actor">'+(c.profile_path?'<img class="av" src="'+imgURL('w185', c.profile_path)+'" loading="lazy" alt="'+esc(c.name||'Actor')+'">':'<div class="ph">'+initials(c.name)+'</div>')+'<div style="min-width:0"><div class="nm">'+esc(c.name||'')+'</div>'+(c.character?'<div class="role">'+esc(c.character)+'</div>':'')+'</div></div>').join('');
  const seen=new Set([a.id]); const pool=[];
  (a.recs||[]).concat(a.similar||[]).map(adapt).filter(Boolean).forEach(r=>{ if(!seen.has(r.id)){ seen.add(r.id); pool.push(r); } });
  const pcards=pool.slice(0,16).map(r=>{ const m=[]; if(r.score) m.push('<span class="star">★ '+(+r.score).toFixed(1)+'</span>'); if(r.year) m.push('<span>'+r.year+'</span>'); m.push('<span>'+(r.type||'TV')+'</span>'); return '<div class="pcard" data-id="'+r.id+'"><img class="pimg" src="'+titleImage(r,'backdrop')+'" loading="lazy" alt="'+esc(r.title||'Recommended title')+' artwork"><div class="pt">'+esc(r.title||'')+'</div><div class="pm">'+m.join('<span class="dot"></span>')+'</div></div>'; }).join('');
  $('deepBody').innerHTML=
    (actorHtml?'<div class="dsec"><h2>Actors</h2><div class="actorgrid">'+actorHtml+'</div></div>':'')+
    (pcards?'<div class="dsec"><h2>You may like</h2><div class="pgrid">'+pcards+'</div></div>':'');
  $('deepTrailer').onclick=()=>playTrailer(a);
  const dh=$('deepHeart'); dh.onclick=()=>{ toggleWLObj(a); const f=inWL(a); dh.classList.toggle('on',f); dh.innerHTML=f?'♥':'+'; };
  $('deepSim').onclick=()=>{ const el=$('deepBody').querySelector('.pgrid'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); else toast('No similar titles found.'); };
  $('deepBody').querySelectorAll('.pcard').forEach(el=>el.onclick=()=>jumpTo(parseInt(el.dataset.id)));
}

/* ===== grid view (search / list) ===== */
function showGridShell(title){ $('landing').style.display='none'; $('gridView').classList.add('show'); header.classList.add('solid'); $('gvTitle').textContent=title; $('grid').innerHTML='<div class="rempty">Loading…</div>'; showApiNotice(); window.scrollTo(0,0); }
function renderGrid(arr,empty){
  if(!arr.length){ $('grid').innerHTML='<div class="rempty">'+empty+'</div>'; return; }
  $('grid').innerHTML=arr.map(a=>cardHTML(a,'land')).join(''); wireCards($('grid'));
}
function goHome(){ $('gridView').classList.remove('show'); $('landing').style.display='block'; if(window.scrollY<60) header.classList.remove('solid'); }
async function doSearch(q){
  if(!q.trim()) return;
  if(!hasKey()){ showGridShell('Search'); renderGrid([],'TMDB key required to search.'); return; }
  showGridShell('Search: '+q); showLoader(true);
  try{
    const u=p=>tmdbURL('/search/tv','include_adult=false&query='+encodeURIComponent(q)+'&page='+p);
    const [d1,d2]=await Promise.all([ fetchJSON(u(1)), fetchJSON(u(2)).catch(()=>({results:[]})) ]);
    let arr=(d1.results||[]).concat(d2.results||[]).map(adapt).filter(Boolean).filter(isAnime).filter(a=>a.backdrop||a.poster);
    const seen=new Set(); arr=arr.filter(a=>{ if(seen.has(a.id)) return false; seen.add(a.id); return true; });
    renderGrid(arr,'No anime found for “'+esc(q)+'”. Try another title.');
  }catch(e){ renderGrid([],'Search failed — check your connection.'); }
  showLoader(false);
}
function openList(){ showGridShell('My List'); renderGrid(WL.slice().reverse(),'Your list is empty — tap the heart on any title to save it.'); }

/* ===== events ===== */
$('brand').onclick=()=>{ goHome(); window.scrollTo({top:0,behavior:'smooth'}); setNav('navHome'); };
$('navHome').onclick=()=>{ goHome(); window.scrollTo({top:0,behavior:'smooth'}); setNav('navHome'); };
$('navBrowse').onclick=()=>{ goHome(); setNav('navBrowse'); const r=document.querySelector('.row'); if(r) r.scrollIntoView({behavior:'smooth'}); };
$('navListTop').onclick=()=>{ setNav('navListTop'); openList(); };
$('navList').onclick=openList;
$('gvClose').onclick=()=>{ goHome(); setNav('navHome'); };
function setNav(id){ document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id===id)); }
$('searchForm').addEventListener('submit',e=>{ e.preventDefault(); const q=$('searchInput').value; if(q.trim()){ doSearch(q); $('searchInput').blur(); } });
$('searchInput').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  const q=e.target.value.trim();
  if(!q){ if($('gridView').classList.contains('show')) goHome(); return; }
  searchTimer=setTimeout(()=>doSearch(q), 350);
});
$('deepClose').onclick=closeDeep;
$('deepBackBtn').onclick=deepBack;
$('modalClose').onclick=closeModal;
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

window.addEventListener('scroll',()=>{ if($('gridView').classList.contains('show')) return; header.classList.toggle('solid', window.scrollY>60); });
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('modal').classList.contains('show')) return closeModal();
    if($('deep').classList.contains('show')) return deepBack();
    if($('gridView').classList.contains('show')) return goHome();
  }
});
window.addEventListener('popstate',()=>{
  if($('modal').classList.contains('show')) return closeModal();
  if($('deep').classList.contains('show')) return deepBack();
  if($('gridView').classList.contains('show')) return goHome();
});

async function loadGenreMap(){ try{ const d=await fetchJSON(TMDB+'/genre/tv/list?api_key='+KEY); (d.genres||[]).forEach(g=>GENRE_MAP[g.id]=g.name); }catch(e){} }

async function init(){
  $('wlCount').textContent=WL.length;
  await loadGenreMap();
  buildHome();
  try{
    const d=await fetchJSON(TMDB+'/trending/tv/week?api_key='+KEY+'&page=1');
    heroItems=(d.results||[]).map(adapt).filter(Boolean).filter(isAnime).filter(a=>a.backdrop).slice(0,6);
    if(heroItems.length){ heroIdx=0; renderHero(heroItems[0]); restartHero(); }
    else { $('heroContent').innerHTML='<h1>ANIVERSE</h1><p class="hsyn">Discover thousands of anime titles — browse the rows below.</p>'; }
  }catch(e){ $('heroContent').innerHTML='<h1>ANIVERSE</h1><p class="hsyn">Discover thousands of anime titles — browse the rows below.</p>'; }
  try{ window.history.replaceState({app:1},''); }catch(e){}
  showLoader(false);
}
init();
</script>
